# ============================================================================
# TERRAFORM-LAB PYTHON PROJECT CONFIGURATION
# ============================================================================

[project]
name = "terraform-lab"
version = "1.0.0"
description = "Automated AWS lab environment for testing Windows and Linux services using Terraform and Ansible"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "Frederic Jacquet", email = "fjacquet@example.com" }
]
keywords = [
    "terraform",
    "ansible",
    "aws",
    "infrastructure",
    "automation",
    "lab",
    "windows",
    "linux",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Topic :: System :: Systems Administration",
    "Topic :: Software Development :: Testing",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]

dependencies = [
    # Core Ansible
    "ansible>=12.2.0",
    "ansible-lint>=25.11.0",
    "ansible-parallel>=2023.7.26",
    # AWS Integration
    "boto3>=1.40.70",
    "botocore>=1.35.70",
    # Windows Remote Management
    "pywinrm>=0.5.0",
    "pypsrp>=0.8.1",
    "pyspnego>=0.12.0",
    "kerberos>=1.3.1",
    # Security and Secrets Management
    "hvac[parser]>=2.4.0", # HashiCorp Vault client
    "cryptography>=46.0.3",
    # HTTP and Networking
    "aiohttp>=3.13.2",
    "requests[security,socks]>=2.32.5",
    # Testing and Quality
    "molecule>=25.11.0",
    "molecule-docker>=2.1.0",
    "yamllint>=1.37.1",
    # Azure (optional - for multi-cloud support)
    "azure-mgmt-redhatopenshift>=2.0.0",
    # Build tools
    "pip>=25.3",
    "setuptools>=80.9.0",
]

[project.optional-dependencies]
dev = [
    "pre-commit>=4.0.0",
    "black>=24.0.0",
    "isort>=5.13.0",
    "flake8>=7.0.0",
    "mypy>=1.11.0",
    "pytest>=8.0.0",
    "pytest-cov>=6.0.0",
]

docs = [
    "mkdocs>=1.6.0",
    "mkdocs-material>=9.5.0",
    "mkdocstrings[python]>=0.26.0",
]

all = [
    "terraform-lab[dev,docs]",
]

[project.urls]
Homepage = "https://github.com/fjacquet/terraform-lab"
Documentation = "https://github.com/fjacquet/terraform-lab/blob/main/README.md"
Repository = "https://github.com/fjacquet/terraform-lab"
Issues = "https://github.com/fjacquet/terraform-lab/issues"

# ============================================================================
# BUILD SYSTEM
# ============================================================================

[build-system]
requires = ["setuptools>=80.9.0", "wheel"]
build-backend = "setuptools.build_meta"

# ============================================================================
# TOOL CONFIGURATIONS
# ============================================================================

[tool.setuptools]
packages = []  # No Python packages to install, just dependencies

[tool.black]
line-length = 120
target-version = ['py312']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 120
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
follow_imports = "normal"
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --strict-markers --cov=. --cov-report=term-missing"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.coverage.run]
source = ["."]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/.venv/*",
    "*/venv/*",
    "setup.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]

# ============================================================================
# DEPENDENCY GROUPS (for uv and other tools)
# ============================================================================

[dependency-groups]
dev = [
    "pre-commit>=4.0.0",
    "black>=24.0.0",
    "isort>=5.13.0",
    "flake8>=7.0.0",
    "mypy>=1.11.0",
    "pytest>=8.0.0",
    "pytest-cov>=6.0.0",
]

docs = [
    "mkdocs>=1.6.0",
    "mkdocs-material>=9.5.0",
    "mkdocstrings[python]>=0.26.0",
]

# ============================================================================
# ANSIBLE CONFIGURATION
# ============================================================================

# Note: Ansible configuration is in ansible.cfg
# This section documents Python dependencies for Ansible

# Required for AWS dynamic inventory:
# - boto3, botocore

# Required for Windows management:
# - pywinrm, pypsrp, pyspnego, kerberos

# Required for Vault integration:
# - hvac

# ============================================================================
# NOTES
# ============================================================================

# Installation:
#   pip install -e .                    # Install dependencies
#   pip install -e ".[dev]"             # Install with dev dependencies
#   pip install -e ".[all]"             # Install everything
#
# Or with uv (recommended):
#   uv pip install -e .                 # Install dependencies
#   uv sync --group dev                 # Install with dev group
#   uv sync --all-groups                # Install all groups
#
# Development:
#   pre-commit install                  # Install pre-commit hooks
#   pre-commit run --all-files          # Run all hooks
#
# Testing:
#   pytest                              # Run tests
#   pytest --cov                        # Run tests with coverage
#
# Linting:
#   black .                             # Format Python code
#   isort .                             # Sort imports
#   flake8 .                            # Lint Python code
#   mypy .                              # Type checking
#   ansible-lint                        # Lint Ansible playbooks
#   yamllint .                          # Lint YAML files
